[project]
name = "citeio"
dynamic = ["version"]
description = "Render Cite research reports on your own site: an API client and HTML fragments for the presentation object."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chalkstream Development", email = "hello@chalkstream.dev" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["cite", "citeio", "research", "reports", "citations"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://cite.io"
Repository = "https://github.com/chalkstreamdev/citeio-python"
Issues = "https://github.com/chalkstreamdev/citeio-python/issues"
Changelog = "https://github.com/chalkstreamdev/citeio-python/blob/master/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/citeio/__init__.py"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.15"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
